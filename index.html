<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IngenieDía — Tu dosis diaria de ingeniería" />
    <meta name="theme-color" content="#0f1117" />
    <link rel="preload" href="/fonts/ibm-plex-sans-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-500.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Letra de la app servida desde el propio sitio. "block": el texto espera a la letra
         en vez de mostrarse primero con la del teléfono y cambiar después. */
      @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:block;src:url(/fonts/ibm-plex-sans-500.woff2) format('woff2')}
      @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:700;font-display:block;src:url(/fonts/ibm-plex-sans-700.woff2) format('woff2')}
      html,body{margin:0;padding:0;background:#0f1117}
      /* Pantalla de carga (fuera de #root para que React no la vuelva a dibujar).
         Parte con el rayo al centro, igual que la pantalla de Android; luego el rayo
         sube y aparecen el nombre y el lema, y el bloque completo queda centrado. */
      .carga{position:fixed;inset:0;z-index:50;background:#0f1117;font-family:'IBM Plex Sans',system-ui,sans-serif;transition:opacity .25s ease}
      .carga.fuera{opacity:0;pointer-events:none}
      .carga img{position:absolute;left:50%;top:calc(50% - 47px);width:112px;height:112px;transform:translate(-50%,-50%);animation:sube .5s cubic-bezier(.2,.7,.2,1) .15s both}
      .carga .lema{position:absolute;left:0;right:0;top:calc(50% + 29px);text-align:center;animation:aparece .45s ease-out .4s both}
      .carga .t{color:#f3f4f6;font-size:34px;font-weight:700;margin:0;letter-spacing:-.01em}
      .carga .s{color:#22d3ee;font-size:17px;font-weight:500;margin:8px 0 0}
      @keyframes sube{from{transform:translate(-50%,calc(-50% + 47px))}to{transform:translate(-50%,-50%)}}
      @keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.carga img,.carga .lema{animation:none}}
    </style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>IngenieDía</title>
  </head>
  <body>
    <div id="carga" class="carga"><img src="/icons/icon-192.png" alt=""><div class="lema"><p class="t">IngenieDía</p><p class="s">Tu dosis diaria de ingeniería</p></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
